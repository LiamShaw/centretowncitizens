{{- $dest := .Destination -}}
{{- if hasPrefix $dest "/" -}}
  {{- $dest = printf "%s%s" (site.BaseURL | replaceRE "/$" "") (replaceRE "^/" "/" $dest) -}}
{{- end -}}
<a href="{{ $dest | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.HasPrefix $dest "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
