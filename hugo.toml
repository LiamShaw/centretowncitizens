baseURL = "https://www.centretowncitizens.ca/"
languageCode = "en-CA"
title = "Centretown Community Association"
enableGitInfo = false
enableRobotsTXT = true

# The homepage is a static page exported from Squarespace.
[params]
description = "Working for and with everyone who lives, works and plays in Centretown."
email = "ccca@centretowncitizens.ca"
address = "101-210 Gloucester Street, Ottawa, ON K2P 2K4"
twitter = "CentretownCCA"
facebook = "https://www.facebook.com/CentretownCCA/"
# The newsletter form is wired up in a later step. Until then the form is
# hidden rather than shown collecting addresses it cannot store.
newsletter_enabled = false

[permalinks]
# The explicit slug in each file's front matter preserves the exact Squarespace
# URL, so the redirect map and the published paths line up.
news = "/news/:slug/"
advocacy = "/advocacy/:slug/"
events = "/events/:slug/"
# Committee pages keep Hugo's default path, so a post sits at
# /committees/heritage/slug/ beside its committee's landing page.
[taxonomies]
category = "categories"

# The Cloudflare Pages redirect map is rendered during the build, so it can
# never be left out of a deployment. Cloudflare expects a file named
# _redirects at the root of the published site.
[mediaTypes."text/redirects"]
suffixes = ["txt"]

[outputFormats.redirects]
mediaType = "text/redirects"
baseName = "_redirects"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "redirects"]

